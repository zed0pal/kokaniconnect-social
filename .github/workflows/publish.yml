name: Publish to Instagram

# Runs every hour (and at 11:32 UTC = 2:32 PM KSA for the regular slots), so
# any approved post publishes shortly after its scheduled_at time, on any day.
# GitHub may start scheduled runs a few minutes late. A post is only ever
# published once; runs with nothing due finish in seconds.
on:
  schedule:
    - cron: "2 * * * *"
    - cron: "32 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check the queue without posting)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish due, approved posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scripts/publish.py

      - name: Save queue status
        if: always()
        run: |
          if ! git diff --quiet queue/posts.json; then
            git config user.name "kokani-social-bot"
            git config user.email "kokani-social-bot@users.noreply.github.com"
            git add queue/posts.json
            git commit -m "Update post status [skip ci]"
            git push
          fi
