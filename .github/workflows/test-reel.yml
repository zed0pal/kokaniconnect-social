name: Test Reel upload (no posting)

# Uploads media/test-reel.mp4 to Instagram as a Reel container and waits for
# Instagram to accept it. It never publishes anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Instagram accepts our Reel format
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CHECK_REEL: media/test-reel.mp4
        run: python3 scripts/publish.py
